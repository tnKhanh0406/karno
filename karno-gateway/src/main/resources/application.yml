server:
  port: 8080

spring:
  application:
    name: karno-gateway
  cloud:
    gateway:
      routes:
        - id: karno-user-route
          uri: http://karno-user-service:80
          predicates:
            - Path=/api/users/**

        - id: karno-order-route
          uri: http://karno-order-service:80
          predicates:
            - Path=/api/orders/**

        - id: karno-product-route
          uri: http://karno-product-service:80
          predicates:
            - Path=/api/products/**,/api/product-reviews/**,/api/categories/**

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
