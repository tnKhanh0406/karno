spring.application.name=karno-fleet
server.port=8080

spring.datasource.url=${DB_FLEET_URL:jdbc:postgresql://localhost:5432/karno_fleet}
spring.datasource.username=${DB_FLEET_USERNAME:postgres}
spring.datasource.password=${DB_FLEET_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnofleet.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

fleet.trip-generator.cron=0 5 0 * * *
fleet.trip-generator.default-horizon-days=7
