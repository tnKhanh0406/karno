spring.application.name=karno-fleet
server.port=8085

spring.datasource.url=${DB_FLEET_URL:jdbc:postgresql://localhost:5432/karno_fleet}
spring.datasource.username=${DB_FLEET_USERNAME:postgres}
spring.datasource.password=${DB_FLEET_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnofleet.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

fleet.trip-generator.cron=0 5 0 * * *
fleet.trip-generator.default-horizon-days=7

routing.osrm.base-url=https://router.project-osrm.org
routing.osrm.profile=driving

routing.matrix.provider=osrm
here.matrix.base-url=https://matrix.router.hereapi.com
here.matrix.api-key=${HERE_API_KEY}
here.matrix.transport-mode=scooter
here.matrix.routing-mode=fast
here.matrix.region-margin-meters=10000
here.matrix.zone-id=Asia/Ho_Chi_Minh
here.matrix.vehicle.current-weight-kg=300
here.matrix.vehicle.gross-weight-kg=300

routing.geometry.provider=osrm

here.routing.base-url=https://router.hereapi.com
here.routing.api-key=${HERE_API_KEY}

here.routing.transport-mode=${here.matrix.transport-mode}
here.routing.routing-mode=${here.matrix.routing-mode}
here.routing.zone-id=${here.matrix.zone-id}

here.routing.scooter-allow-highway=false

here.routing.timeout=10s

services.karno-user.base-url=${KARNO_USER_BASE_URL:http://localhost:8082}
services.karno-shipping.base-url=${KARNO_SHIPPING_BASE_URL:http://localhost:8084}
