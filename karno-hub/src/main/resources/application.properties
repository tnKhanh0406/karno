spring.application.name=karno-hub
server.port=8080

spring.datasource.url=${DB_HUB_URL:jdbc:postgresql://localhost:5432/karno_hub}
spring.datasource.username=${DB_HUB_USERNAME:postgres}
spring.datasource.password=${DB_HUB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnohub.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
