spring.application.name=karno-inventory
server.port=8083

spring.datasource.url=${DB_INVENTORY_URL}
spring.datasource.username=${DB_INVENTORY_USERNAME}
spring.datasource.password=${DB_INVENTORY_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnoinventory.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# KAFKA AZURE
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Security
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="springboot" password="${KAFKA_PASSWORD}";

# SSL - Load certificate from ENV
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_CERT_PEM}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.group-id=karno-inventory

app.kafka.topics.inventory-reservation-requested=inventory.reservation.requested
app.kafka.topics.inventory-confirmation-requested=inventory.confirmation.requested
app.kafka.topics.inventory-release-requested=inventory.release.requested

inventory.reservation-expiration.fixed-delay-ms=60000
inventory.reservation-expiration.batch-size=50

outbox.publisher.fixed-delay-ms=1000
outbox.publisher.batch-size=50
outbox.publisher.send-timeout-ms=5000
outbox.publisher.max-retries=10
