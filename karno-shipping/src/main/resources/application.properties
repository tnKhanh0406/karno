spring.application.name=karno-shipping
server.port=8084

spring.datasource.url=${DB_SHIPPING_URL}
spring.datasource.username=${DB_SHIPPING_USERNAME}
spring.datasource.password=${DB_SHIPPING_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnoshipping.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.driver-class-name=org.postgresql.Driver

services.karno-user.base-url=${KARNO_USER_BASE_URL:http://localhost:8082}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=karno-shipping
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

app.kafka.topics.shipment-creation-requested=shipping.shipment.creation.requested
outbox.publisher.fixed-delay-ms=1000
outbox.publisher.batch-size=50
outbox.publisher.send-timeout-ms=5000
outbox.publisher.max-retries=10

# STANDARD
shipping.pricing.methods.standard.base-fee=15000
shipping.pricing.methods.standard.included-distance-km=5
shipping.pricing.methods.standard.fee-per-km=2000
shipping.pricing.methods.standard.included-weight-gram=2000
shipping.pricing.methods.standard.extra-fee-per-500g=1000
shipping.pricing.methods.standard.estimated-hours=72

# EXPRESS
shipping.pricing.methods.express.base-fee=25000
shipping.pricing.methods.express.included-distance-km=5
shipping.pricing.methods.express.fee-per-km=3000
shipping.pricing.methods.express.included-weight-gram=2000
shipping.pricing.methods.express.extra-fee-per-500g=1500
shipping.pricing.methods.express.estimated-hours=24
