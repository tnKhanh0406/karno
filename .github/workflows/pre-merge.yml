name: Pre-Merge Check (Verify & Test)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'karno-order/**'

permissions:
  contents: read

jobs:
  verify:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Style (Checkstyle & PMD)
        run: mvn checkstyle:check pmd:check

      - name: Build and Test with Maven
        run: mvn clean test
