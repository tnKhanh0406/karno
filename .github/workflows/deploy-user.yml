name: Build & Deploy Karno User Service (GHCR + k3s)
on:
  push:
    branches: [ "main" ]
    paths:
      - 'karno-user/**'
      - 'k8s/karno-user/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'karno-user/**'
      - 'k8s/karno-user/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Jar & Push Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: ./karno-user

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./karno-user
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/karno-user:latest
            ghcr.io/${{ github.repository_owner }}/karno-user:${{ github.sha }}

  deploy-to-k3s:
    name: Deploy to VPS (k3s Cluster)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Kubernetes Manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "k8s/karno-user/*"
          target: "~/deploy-manifests/"

      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo k3s kubectl apply -f ~/deploy-manifests/k8s/karno-user/ -n default
            sudo k3s kubectl set image deployment/karno-user karno-user=ghcr.io/${{ github.repository_owner }}/karno-user:${{ github.sha }} -n default
            sudo k3s kubectl rollout status deployment/karno-user -n default --timeout=120s
