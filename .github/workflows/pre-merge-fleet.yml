name: Pre-Merge Check Karno Fleet

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'karno-fleet/**'

permissions:
  contents: read

jobs:
  verify:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Code Style & Compile Tests
        run: mvn clean test-compile checkstyle:check pmd:check -pl :karno-fleet
