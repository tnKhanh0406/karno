apiVersion: apps/v1
kind: Deployment
metadata:
  name: karno-fleet
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karno-fleet
  template:
    metadata:
      labels:
        app: karno-fleet
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: karno-fleet
          image: ghcr.io/baosatboiz/karno-fleet:latest
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Xms128m -Xmx256m"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "300Mi"
              cpu: "200m"
            limits:
              memory: "500Mi"
              cpu: "500m"
