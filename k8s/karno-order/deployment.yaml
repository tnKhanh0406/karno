apiVersion: apps/v1
kind: Deployment
metadata:
  name: karno-order
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karno-order
  template:
    metadata:
      labels:
        app: karno-order
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: karno-order
          image: ghcr.io/baosatboiz/karno-order:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "300Mi"
              cpu: "200m"
            limits:
              memory: "500Mi"
              cpu: "500m"