# karno-hub deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karno-hub
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karno-hub
  template:
    metadata:
      labels:
        app: karno-hub
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: karno-hub
          image: ghcr.io/baosatboiz/karno-hub:latest
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Xms128m -Xmx256m"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "300Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
              cpu: "500m"
