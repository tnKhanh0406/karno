spring.application.name=karno-order
server.port=8080

spring.datasource.url=${DB_ORDER_URL}
spring.datasource.username=${DB_ORDER_USERNAME}
spring.datasource.password=${DB_ORDER_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
#mybatis.type-handlers-package=com.karnoproduct.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.driver-class-name=org.postgresql.Driver