spring.application.name=karno-order
server.port=8081

spring.datasource.url=${DB_ORDER_URL}
spring.datasource.username=${DB_ORDER_USERNAME}
spring.datasource.password=${DB_ORDER_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnoorder.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.driver-class-name=org.postgresql.Driver

services.karno-user.base-url=${KARNO_USER_BASE_URL:http://localhost:8082}
services.karno-inventory.base-url=${KARNO_INVENTORY_BASE_URL:http://localhost:8083}
services.karno-product.base-url=${KARNO_PRODUCT_BASE_URL:http://localhost:8080}
services.karno-shipping.base-url=${KARNO_SHIPPING_BASE_URL:http://localhost:8084}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

kafka.topics.inventory-reserved=inventory.reserved
kafka.topics.inventory-reservation-failed=inventory.reservation.failed
kafka.topics.inventory-released=inventory.released
kafka.topics.inventory-confirmed=inventory.confirmed
kafka.topics.inventory-reservation-expired=inventory.reservation.expired
kafka.topics.shipment-creation-requested=shipping.shipment.creation.requested
kafka.topics.order-packed=order.packed

outbox.publisher.fixed-delay-ms=1000
outbox.publisher.batch-size=50
outbox.publisher.send-timeout-ms=5000
outbox.publisher.max-retries=10
