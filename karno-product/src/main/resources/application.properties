spring.application.name=karno-product
server.port=8080

spring.datasource.url=${DB_PRODUCT_URL}
spring.datasource.username=${DB_PRODUCT_USERNAME}
spring.datasource.password=${DB_PRODUCT_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis.mapper-locations=classpath:db/mapper/*.xml
mybatis.type-handlers-package=com.karnoproduct.repository.handler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.driver-class-name=org.postgresql.Driver

services.karno-user.base-url=${KARNO_USER_BASE_URL:http://localhost:8082}
services.karno-inventory.base-url=${KARNO_INVENTORY_BASE_URL:http://localhost:8083}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1